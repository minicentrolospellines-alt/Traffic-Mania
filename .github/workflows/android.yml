name: Traffic Mania - APK y AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar 500 niveles y economía
        run: node --test tests/engine.test.cjs

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar firma opcional
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trafficmania.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/trafficmania.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK y AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug

      - name: Guardar APK instalable de prueba
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMania-APK-prueba
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar AAB firmado para Play Console
        if: env.SIGNING_STORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMania-AAB-firmado
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Guardar AAB sin firma
        if: env.SIGNING_STORE_FILE == ''
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMania-AAB-SIN-FIRMA
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Guardar informe Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMania-informe
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/trafficmania.jks"
